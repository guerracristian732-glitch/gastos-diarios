<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Gastos Diarios</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root{
            --bg:#f5f6f8; --panel:#ffffff; --border:#dfe2e7; --text:#1f2430; --muted:#6b7280;
            --accent:#2f4a68; --accent-hover:#25394f; --danger:#b3261e; --danger-bg:#fdecea;
        }
        *{box-sizing:border-box;}
        body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;}
        input{font-size:16px !important;}
        @media (min-width: 640px){ input{font-size:14px !important;} }
        button{font-family:inherit;cursor:pointer;}
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function GastosApp() {
            const hoy = new Date().toISOString().slice(0,10);

            const [cargandoSesion, setCargandoSesion] = useState(true);
            const [isAdmin, setIsAdmin]                 = useState(false);
            const [usuarioNombre, setUsuarioNombre]     = useState('Usuario');

            const [reportes, setReportes]               = useState([]);
            const [filtroFechaInicio, setFiltroFechaInicio] = useState('');
            const [filtroFechaFin, setFiltroFechaFin]   = useState('');
            const [menuAbierto, setMenuAbierto]         = useState(false);
            const [vistaMovil, setVistaMovil]           = useState('inicio');

            const [nombreNuevo, setNombreNuevo]         = useState('');
            const [fechaNueva, setFechaNueva]           = useState(hoy);
            const [itemsNuevos, setItemsNuevos]         = useState([{ id: Date.now(), producto: '', cantidad: '', precio: '' }]);
            const [guardando, setGuardando]             = useState(false);

            const [reporteAbierto, setReporteAbierto]   = useState(null);
            const [nombreEdicion, setNombreEdicion]     = useState('');
            const [fechaEdicion, setFechaEdicion]       = useState('');
            const [itemEditandoId, setItemEditandoId]   = useState(null);
            const [itemEdicion, setItemEdicion]         = useState({ producto:'', cantidad:'', precio:'' });
            const [nuevoItemEnEdicion, setNuevoItemEnEdicion] = useState({ producto:'', cantidad:'', precio:'' });

            useEffect(() => {
                fetch('/api/me').then(async (res) => {
                    if (!res.ok) { window.location.href = '/login.html'; return; }
                    const data = await res.json();
                    setIsAdmin(data.isAdmin);
                    setUsuarioNombre(data.nombre);
                    setCargandoSesion(false);
                    cargarReportes();
                });
            }, []);

            const cargarReportes = async (fechaInicio = '', fechaFin = '') => {
                try {
                    let url = `/api/reportes`;
                    if (fechaInicio && fechaFin) url += `?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`;
                    const res  = await fetch(url);
                    const data = await res.json();
                    if (data.success) setReportes(data.reportes);
                } catch(e) { console.error(e); }
            };

            const cerrarSesion = async () => {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login.html';
            };

            const actualizarItemNuevo = (id, campo, valor) =>
                setItemsNuevos(prev => prev.map(it => it.id === id ? { ...it, [campo]: valor } : it));

            const agregarFilaNueva = () =>
                setItemsNuevos(prev => [...prev, { id: Date.now(), producto: '', cantidad: '', precio: '' }]);

            const eliminarFilaNueva = (id) => {
                if (itemsNuevos.length === 1) return;
                setItemsNuevos(prev => prev.filter(it => it.id !== id));
            };

            const guardarReporteNuevo = async () => {
                if (!nombreNuevo.trim()) { alert('Escribe un nombre para el reporte'); return; }
                const validos = itemsNuevos.filter(it => it.producto && it.cantidad && it.precio);
                if (validos.length === 0) { alert('Agrega al menos un producto'); return; }

                setGuardando(true);
                try {
                    await fetch('/api/reportes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            nombre: nombreNuevo,
                            fecha: fechaNueva,
                            items: validos.map(it => ({ producto: it.producto, cantidad: parseInt(it.cantidad), precio: parseFloat(it.precio) }))
                        })
                    });
                    setNombreNuevo('');
                    setFechaNueva(hoy);
                    setItemsNuevos([{ id: Date.now(), producto: '', cantidad: '', precio: '' }]);
                    cargarReportes(filtroFechaInicio, filtroFechaFin);
                    setVistaMovil('reportes');
                } catch(e) { console.error(e); }
                setGuardando(false);
            };

            const aplicarFiltro = () => {
                if (filtroFechaInicio && filtroFechaFin) cargarReportes(filtroFechaInicio, filtroFechaFin);
                else alert('Completa ambas fechas');
            };
            const limpiarFiltro = () => {
                setFiltroFechaInicio(''); setFiltroFechaFin('');
                cargarReportes();
            };

            const eliminarReporte = async (id, nombre) => {
                if (!confirm(`¿Eliminar el reporte "${nombre}" y todos sus productos?`)) return;
                await fetch(`/api/reportes/${id}`, { method: 'DELETE' });
                if (reporteAbierto === id) setReporteAbierto(null);
                cargarReportes(filtroFechaInicio, filtroFechaFin);
            };

            const abrirEdicion = (r) => {
                setReporteAbierto(r.id);
                setNombreEdicion(r.nombre);
                setFechaEdicion(r.fecha.slice(0,10));
                setItemEditandoId(null);
                setNuevoItemEnEdicion({ producto:'', cantidad:'', precio:'' });
            };
            const cerrarEdicion = () => setReporteAbierto(null);

            const guardarEncabezado = async (id) => {
                if (!nombreEdicion.trim()) { alert('El nombre no puede estar vacío'); return; }
                const res = await fetch(`/api/reportes/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nombreEdicion, fecha: fechaEdicion })
                });
                const data = await res.json();
                if (data.success) cargarReportes(filtroFechaInicio, filtroFechaFin);
            };

            const iniciarEdicionItem = (it) => {
                setItemEditandoId(it.id);
                setItemEdicion({ producto: it.producto, cantidad: it.cantidad, precio: it.precio });
            };
            const cancelarEdicionItem = () => setItemEditandoId(null);

            const guardarItem = async (reporteId, itemId) => {
                if (!itemEdicion.producto || !itemEdicion.cantidad || !itemEdicion.precio) { alert('Completa todos los campos'); return; }
                const res = await fetch(`/api/reportes/${reporteId}/items/${itemId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ producto: itemEdicion.producto, cantidad: parseInt(itemEdicion.cantidad), precio: parseFloat(itemEdicion.precio) })
                });
                const data = await res.json();
                if (data.success) {
                    setItemEditandoId(null);
                    cargarReportes(filtroFechaInicio, filtroFechaFin);
                }
            };

            const eliminarItem = async (reporteId, itemId) => {
                if (!confirm('¿Eliminar este producto del reporte?')) return;
                await fetch(`/api/reportes/${reporteId}/items/${itemId}`, { method: 'DELETE' });
                cargarReportes(filtroFechaInicio, filtroFechaFin);
            };

            const agregarItemAlReporte = async (reporteId) => {
                const { producto, cantidad, precio } = nuevoItemEnEdicion;
                if (!producto || !cantidad || !precio) { alert('Completa producto, cantidad y precio'); return; }
                await fetch(`/api/reportes/${reporteId}/items`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ producto, cantidad: parseInt(cantidad), precio: parseFloat(precio) })
                });
                setNuevoItemEnEdicion({ producto:'', cantidad:'', precio:'' });
                cargarReportes(filtroFechaInicio, filtroFechaFin);
            };

            const descargarPDFReporte = (r) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape' });
                const fechaFormateada = new Date(r.fecha + 'T12:00:00').toLocaleDateString('es-PE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                doc.setFontSize(16); doc.setTextColor(31, 36, 48);
                doc.text(r.nombre, 148, 18, { align: 'center' });
                doc.setFontSize(9); doc.setTextColor(107, 114, 128);
                doc.text(`Fecha: ${fechaFormateada}   |   Productos: ${r.items.length}`, 148, 25, { align: 'center' });

                const filas = r.items.map((it, i) => [
                    i + 1, it.producto, it.cantidad,
                    `S/ ${parseFloat(it.precio).toFixed(2)}`,
                    `S/ ${parseFloat(it.monto).toFixed(2)}`
                ]);

                doc.autoTable({
                    startY: 32,
                    head: [['#', 'Producto', 'Cantidad', 'Precio Unit.', 'Monto']],
                    body: filas,
                    headStyles: { fillColor: [47, 74, 104], textColor: 255 },
                    alternateRowStyles: { fillColor: [245, 246, 248] },
                    styles: { fontSize: 9 }
                });

                const finalY = doc.lastAutoTable.finalY + 10;
                doc.setFontSize(12); doc.setTextColor(31, 36, 48);
                doc.text(`Monto Total: S/ ${r.total.toFixed(2)}`, 20, finalY);
                doc.save(`${r.nombre.replace(/\s+/g,'_')}_${r.fecha}.pdf`);
            };

            const descargarPDFGeneral = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape' });
                const montoTotalPDF = reportes.reduce((s, r) => s + r.total, 0);
                const fecha = new Date().toLocaleString('es-PE');
                const rango = (filtroFechaInicio && filtroFechaFin) ? `${filtroFechaInicio} al ${filtroFechaFin}` : 'Todos los registros';

                doc.setFontSize(16); doc.setTextColor(31, 36, 48);
                doc.text('Gastos Diarios - Reporte General', 148, 18, { align: 'center' });
                doc.setFontSize(9); doc.setTextColor(107, 114, 128);
                doc.text(`Generado: ${fecha}   |   Periodo: ${rango}   |   Reportes: ${reportes.length}`, 148, 25, { align: 'center' });

                const filas = [];
                reportes.forEach(r => {
                    r.items.forEach(it => {
                        filas.push([r.nombre, it.producto, it.cantidad, `S/ ${parseFloat(it.precio).toFixed(2)}`, `S/ ${parseFloat(it.monto).toFixed(2)}`, r.fecha]);
                    });
                });

                doc.autoTable({
                    startY: 32,
                    head: [['Nombre reporte', 'Producto', 'Cantidad', 'Precio Unit.', 'Monto', 'Fecha']],
                    body: filas,
                    headStyles: { fillColor: [47, 74, 104], textColor: 255 },
                    alternateRowStyles: { fillColor: [245, 246, 248] },
                    styles: { fontSize: 9 }
                });

                const finalY = doc.lastAutoTable.finalY + 10;
                doc.setFontSize(12); doc.setTextColor(31, 36, 48);
                doc.text(`Monto Total: S/ ${montoTotalPDF.toFixed(2)}`, 20, finalY);
                doc.save(`gastos_general_${new Date().toISOString().slice(0,10)}.pdf`);
            };

            if (cargandoSesion) {
                return <div style={{minHeight:'100vh',background:'#f5f6f8',display:'flex',alignItems:'center',justifyContent:'center'}}><p style={{color:'#6b7280',fontSize:14}}>Cargando…</p></div>;
            }

            const montoTotalFormulario = itemsNuevos.reduce((s, it) => s + ((parseInt(it.cantidad)||0) * (parseFloat(it.precio)||0)), 0);
            const montoTotalGeneral    = reportes.reduce((s, r) => s + r.total, 0);

            const S = {
                page: { minHeight:'100vh', background:'#f5f6f8' },
                nav: { background:'#fff', borderBottom:'1px solid #dfe2e7', position:'sticky', top:0, zIndex:50 },
                navInner: { maxWidth:960, margin:'0 auto', padding:'0 16px', display:'flex', justifyContent:'space-between', alignItems:'center', height:60 },
                navLeft: { display:'flex', alignItems:'center', gap:12 },
                logo: { width:40, height:40, borderRadius:4, objectFit:'cover', background:'#eef0f3', border:'1px solid #dfe2e7' },
                navTitle: { fontSize:15, fontWeight:700, margin:0, letterSpacing:'0.2px' },
                navSub: { fontSize:12, color:'#6b7280', margin:0 },
                btnGhost: { background:'#fff', border:'1px solid #dfe2e7', color:'#1f2430', fontSize:13, fontWeight:600, padding:'8px 14px', borderRadius:4 },
                btnDanger: { background:'#fff', border:'1px solid #dfe2e7', color:'var(--danger)', fontSize:13, fontWeight:600, padding:'8px 14px', borderRadius:4 },
                container: { maxWidth:960, margin:'0 auto', padding:'20px 16px' },
                summaryCard: { background:'#fff', border:'1px solid #dfe2e7', borderRadius:6, padding:'20px 24px', marginBottom:20, display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:12 },
                panel: { background:'#fff', border:'1px solid #dfe2e7', borderRadius:6, padding:20, marginBottom:20 },
                panelTitle: { fontSize:14, fontWeight:700, margin:'0 0 16px 0', color:'#1f2430' },
                input: { width:'100%', border:'1px solid #dfe2e7', borderRadius:4, padding:'8px 10px', background:'#fff', color:'#1f2430' },
                label: { display:'block', fontSize:12, color:'#6b7280', marginBottom:4, fontWeight:600 },
                th: { textAlign:'left', padding:'8px 10px', fontSize:12, color:'#6b7280', fontWeight:700, borderBottom:'1px solid #dfe2e7' },
                td: { padding:'10px', fontSize:13, borderBottom:'1px solid #eef0f3' },
                btnPrimary: { background:'#2f4a68', color:'#fff', border:'none', borderRadius:4, padding:'10px 16px', fontWeight:600, fontSize:13 },
                btnSecondary: { background:'#fff', color:'#1f2430', border:'1px solid #dfe2e7', borderRadius:4, padding:'10px 16px', fontWeight:600, fontSize:13 },
            };

            return (
                <div style={S.page}>
                    <nav style={S.nav}>
                        <div style={S.navInner}>
                            <div style={S.navLeft}>
                                <img src="img/logo_navbar.png" alt="Logo" style={S.logo} />
                                <div>
                                    <p style={S.navTitle}>Gastos Diarios</p>
                                    <p style={S.navSub}>{usuarioNombre}</p>
                                </div>
                            </div>
                            <div style={{display: window.innerWidth < 640 ? 'none' : 'flex', gap:8}}>
                                {isAdmin && <a href="admin.html" style={{...S.btnGhost, textDecoration:'none', display:'inline-block'}}>Administración</a>}
                                <button onClick={cerrarSesion} style={S.btnDanger}>Cerrar sesión</button>
                            </div>
                            <button style={{...S.btnGhost, display: window.innerWidth < 640 ? 'inline-block' : 'none'}} onClick={() => setMenuAbierto(!menuAbierto)}>
                                {menuAbierto ? 'Cerrar' : 'Menú'}
                            </button>
                        </div>
                        {menuAbierto && (
                            <div style={{borderTop:'1px solid #dfe2e7', padding:12, display:'flex', flexDirection:'column', gap:8}}>
                                {isAdmin && <a href="admin.html" style={{...S.btnGhost, textAlign:'center', textDecoration:'none'}}>Administración</a>}
                                <button onClick={cerrarSesion} style={S.btnDanger}>Cerrar sesión</button>
                            </div>
                        )}
                    </nav>

                    <div style={{display:'flex', borderBottom:'1px solid #dfe2e7', background:'#fff'}} className="tabs-movil">
                        {[{id:'inicio',label:'Inicio'},{id:'agregar',label:'Nuevo reporte'},{id:'reportes',label:`Reportes (${reportes.length})`}].map(tab => (
                            <button key={tab.id} onClick={() => setVistaMovil(tab.id)}
                                style={{
                                    flex:1, padding:'10px 4px', fontSize:12, fontWeight:600, border:'none', background:'transparent',
                                    color: vistaMovil===tab.id ? '#2f4a68' : '#6b7280',
                                    borderBottom: vistaMovil===tab.id ? '2px solid #2f4a68' : '2px solid transparent'
                                }}>
                                {tab.label}
                            </button>
                        ))}
                    </div>

                    <div style={S.container}>

                        <div className="vista-inicio">
                            <div style={S.summaryCard}>
                                <div>
                                    <p style={{fontSize:12, color:'#6b7280', margin:'0 0 4px 0', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.4px'}}>Monto total</p>
                                    <p style={{fontSize:30, fontWeight:700, margin:0, color:'#1f2430'}}>S/ {montoTotalGeneral.toFixed(2)}</p>
                                </div>
                                <div style={{textAlign:'right'}}>
                                    <p style={{fontSize:12, color:'#6b7280', margin:'0 0 4px 0', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.4px'}}>Reportes</p>
                                    <p style={{fontSize:20, fontWeight:700, margin:0, color:'#1f2430'}}>{reportes.length}</p>
                                </div>
                            </div>
                        </div>

                        <div className="vista-agregar">
                            <div style={S.panel}>
                                <h2 style={S.panelTitle}>Nuevo reporte</h2>

                                <div style={{display:'grid', gridTemplateColumns: window.innerWidth >= 640 ? '2fr 1fr' : '1fr', gap:12, marginBottom:16}}>
                                    <div>
                                        <label style={S.label}>Nombre del reporte</label>
                                        <input type="text" value={nombreNuevo} onChange={e => setNombreNuevo(e.target.value)} style={S.input} placeholder="Ej: Compras del mercado" />
                                    </div>
                                    <div>
                                        <label style={S.label}>Fecha</label>
                                        <input type="date" value={fechaNueva} onChange={e => setFechaNueva(e.target.value)} style={S.input} />
                                    </div>
                                </div>

                                <p style={{fontSize:12, fontWeight:700, color:'#374151', margin:'0 0 8px 0'}}>Productos del reporte</p>

                                <div className="filas-movil">
                                    {itemsNuevos.map((it) => {
                                        const monto = (parseInt(it.cantidad)||0) * (parseFloat(it.precio)||0);
                                        return (
                                            <div key={it.id} style={{border:'1px solid #dfe2e7', borderRadius:4, padding:12, marginBottom:10}}>
                                                <div style={{display:'flex', justifyContent:'space-between', marginBottom:8}}>
                                                    <span style={{fontSize:11, color:'#6b7280', fontWeight:700}}>PRODUCTO</span>
                                                    {itemsNuevos.length > 1 && <button onClick={() => eliminarFilaNueva(it.id)} style={{background:'none', border:'none', color:'var(--danger)', fontSize:12, fontWeight:600}}>Quitar</button>}
                                                </div>
                                                <input type="text" value={it.producto} onChange={(e) => actualizarItemNuevo(it.id,'producto',e.target.value)} style={{...S.input, marginBottom:8}} placeholder="Descripción" />
                                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                                                    <div>
                                                        <label style={S.label}>Cantidad</label>
                                                        <input type="number" value={it.cantidad} onChange={(e) => actualizarItemNuevo(it.id,'cantidad',e.target.value)} style={S.input} placeholder="0" />
                                                    </div>
                                                    <div>
                                                        <label style={S.label}>Precio unit.</label>
                                                        <input type="number" value={it.precio} onChange={(e) => actualizarItemNuevo(it.id,'precio',e.target.value)} style={S.input} placeholder="0.00" />
                                                    </div>
                                                </div>
                                                <div style={{textAlign:'right', marginTop:8, fontSize:13, fontWeight:700, color:'#2f4a68'}}>Monto: S/ {monto.toFixed(2)}</div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="tabla-desktop" style={{overflowX:'auto'}}>
                                    <table style={{width:'100%', borderCollapse:'collapse'}}>
                                        <thead>
                                            <tr>
                                                <th style={S.th}>Producto</th>
                                                <th style={{...S.th, width:100}}>Cantidad</th>
                                                <th style={{...S.th, width:110}}>Precio unit.</th>
                                                <th style={{...S.th, width:100}}>Monto</th>
                                                <th style={{...S.th, width:50, textAlign:'center'}}></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {itemsNuevos.map((it) => {
                                                const monto = (parseInt(it.cantidad)||0) * (parseFloat(it.precio)||0);
                                                return (
                                                    <tr key={it.id}>
                                                        <td style={S.td}><input type="text" value={it.producto} onChange={(e) => actualizarItemNuevo(it.id,'producto',e.target.value)} style={S.input} placeholder="Descripción" /></td>
                                                        <td style={S.td}><input type="number" value={it.cantidad} onChange={(e) => actualizarItemNuevo(it.id,'cantidad',e.target.value)} style={S.input} placeholder="0" /></td>
                                                        <td style={S.td}><input type="number" value={it.precio} onChange={(e) => actualizarItemNuevo(it.id,'precio',e.target.value)} style={S.input} placeholder="0.00" /></td>
                                                        <td style={{...S.td, fontWeight:700, color:'#2f4a68'}}>S/ {monto.toFixed(2)}</td>
                                                        <td style={{...S.td, textAlign:'center'}}><button onClick={() => eliminarFilaNueva(it.id)} style={{background:'none', border:'none', color:'var(--danger)', fontWeight:700, fontSize:15}}>×</button></td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>

                                <div style={{marginTop:14, background:'#f5f6f8', border:'1px solid #dfe2e7', borderRadius:4, padding:'10px 14px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                                    <span style={{fontSize:13, fontWeight:600, color:'#374151'}}>Monto total del reporte</span>
                                    <span style={{fontSize:17, fontWeight:700, color:'#2f4a68'}}>S/ {montoTotalFormulario.toFixed(2)}</span>
                                </div>

                                <div style={{display:'flex', gap:8, marginTop:14, flexWrap:'wrap'}}>
                                    <button onClick={guardarReporteNuevo} disabled={guardando} style={{...S.btnPrimary, flex:1, minWidth:140, opacity: guardando ? 0.6 : 1}}>
                                        {guardando ? 'Guardando…' : 'Guardar reporte'}
                                    </button>
                                    <button onClick={agregarFilaNueva} style={{...S.btnSecondary, flex:1, minWidth:140}}>Agregar fila</button>
                                </div>
                            </div>
                        </div>

                        <div className="vista-reportes">
                            <div style={S.panel}>
                                <h2 style={S.panelTitle}>Filtrar por fecha</h2>
                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                                    <div>
                                        <label style={S.label}>Desde</label>
                                        <input type="date" value={filtroFechaInicio} onChange={(e) => setFiltroFechaInicio(e.target.value)} style={S.input} />
                                    </div>
                                    <div>
                                        <label style={S.label}>Hasta</label>
                                        <input type="date" value={filtroFechaFin} onChange={(e) => setFiltroFechaFin(e.target.value)} style={S.input} />
                                    </div>
                                </div>
                                <div style={{display:'flex', gap:8, marginTop:10, flexWrap:'wrap'}}>
                                    <button onClick={aplicarFiltro} style={{...S.btnPrimary, flex:1, minWidth:100}}>Filtrar</button>
                                    <button onClick={limpiarFiltro} style={{...S.btnSecondary, flex:1, minWidth:100}}>Limpiar</button>
                                    <button onClick={descargarPDFGeneral} style={{...S.btnSecondary, flex:1, minWidth:140}}>Descargar PDF general</button>
                                </div>
                            </div>

                            {reportes.length > 0 ? reportes.map(r => {
                                const abierto = reporteAbierto === r.id;
                                const fechaFormateada = new Date(r.fecha + 'T12:00:00').toLocaleDateString('es-PE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                                return (
                                    <div key={r.id} style={{...S.panel, padding:0, overflow:'hidden'}}>
                                        <div style={{padding:'12px 16px', borderBottom:'1px solid #dfe2e7', background:'#f9fafb', display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:8}}>
                                            <div>
                                                <p style={{fontWeight:700, fontSize:14, margin:'0 0 2px 0'}}>{r.nombre}</p>
                                                <p style={{fontSize:11, color:'#6b7280', margin:0, textTransform:'capitalize'}}>{fechaFormateada}</p>
                                            </div>
                                            <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
                                                <span style={{fontSize:13, fontWeight:700, color:'#2f4a68'}}>S/ {r.total.toFixed(2)}</span>
                                                <button onClick={() => descargarPDFReporte(r)} style={{...S.btnSecondary, padding:'5px 10px', fontSize:12}}>PDF</button>
                                                <button onClick={() => abierto ? cerrarEdicion() : abrirEdicion(r)} style={{...S.btnSecondary, padding:'5px 10px', fontSize:12}}>{abierto ? 'Cerrar' : 'Editar'}</button>
                                                <button onClick={() => eliminarReporte(r.id, r.nombre)} style={{...S.btnDanger, padding:'5px 10px', fontSize:12}}>Eliminar</button>
                                            </div>
                                        </div>

                                        {!abierto && (
                                            <div style={{padding:'6px 16px'}}>
                                                {r.items.map(it => (
                                                    <div key={it.id} style={{display:'flex', justifyContent:'space-between', padding:'6px 0', borderBottom:'1px solid #f3f4f6', fontSize:13}}>
                                                        <span>{it.producto} <span style={{color:'#9ca3af'}}>× {it.cantidad}</span></span>
                                                        <span style={{fontWeight:600, color:'#2f4a68'}}>S/ {parseFloat(it.monto).toFixed(2)}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {abierto && (
                                            <div style={{padding:16}}>
                                                <div style={{display:'grid', gridTemplateColumns: window.innerWidth >= 640 ? '2fr 1fr auto' : '1fr', gap:8, marginBottom:16, alignItems:'end'}}>
                                                    <div>
                                                        <label style={S.label}>Nombre del reporte</label>
                                                        <input type="text" value={nombreEdicion} onChange={e => setNombreEdicion(e.target.value)} style={S.input} />
                                                    </div>
                                                    <div>
                                                        <label style={S.label}>Fecha</label>
                                                        <input type="date" value={fechaEdicion} onChange={e => setFechaEdicion(e.target.value)} style={S.input} />
                                                    </div>
                                                    <button onClick={() => guardarEncabezado(r.id)} style={{...S.btnPrimary, height:37}}>Guardar</button>
                                                </div>

                                                <p style={{fontSize:12, fontWeight:700, color:'#374151', margin:'0 0 8px 0'}}>Productos</p>

                                                {r.items.map(it => (
                                                    itemEditandoId === it.id ? (
                                                        <div key={it.id} style={{border:'1px solid #2f4a68', borderRadius:4, padding:10, marginBottom:8}}>
                                                            <input type="text" value={itemEdicion.producto} onChange={e => setItemEdicion({...itemEdicion, producto:e.target.value})} style={{...S.input, marginBottom:6}} placeholder="Producto" />
                                                            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:6, marginBottom:8}}>
                                                                <input type="number" value={itemEdicion.cantidad} onChange={e => setItemEdicion({...itemEdicion, cantidad:e.target.value})} style={S.input} placeholder="Cantidad" />
                                                                <input type="number" value={itemEdicion.precio} onChange={e => setItemEdicion({...itemEdicion, precio:e.target.value})} style={S.input} placeholder="Precio" />
                                                            </div>
                                                            <div style={{display:'flex', gap:8}}>
                                                                <button onClick={() => guardarItem(r.id, it.id)} style={{...S.btnPrimary, flex:1}}>Guardar</button>
                                                                <button onClick={cancelarEdicionItem} style={{...S.btnSecondary, flex:1}}>Cancelar</button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div key={it.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 10px', border:'1px solid #eef0f3', borderRadius:4, marginBottom:8, fontSize:13}}>
                                                            <span>{it.producto} <span style={{color:'#9ca3af'}}>× {it.cantidad} — S/{parseFloat(it.precio).toFixed(2)} c/u</span></span>
                                                            <div style={{display:'flex', gap:10, alignItems:'center'}}>
                                                                <span style={{fontWeight:700, color:'#2f4a68'}}>S/ {parseFloat(it.monto).toFixed(2)}</span>
                                                                <button onClick={() => iniciarEdicionItem(it)} style={{background:'none', border:'none', color:'#2f4a68', fontWeight:600, fontSize:12}}>Editar</button>
                                                                <button onClick={() => eliminarItem(r.id, it.id)} style={{background:'none', border:'none', color:'var(--danger)', fontWeight:600, fontSize:12}}>Eliminar</button>
                                                            </div>
                                                        </div>
                                                    )
                                                ))}

                                                <div style={{border:'1px dashed #dfe2e7', borderRadius:4, padding:12, marginTop:12}}>
                                                    <p style={{fontSize:12, fontWeight:700, color:'#374151', margin:'0 0 8px 0'}}>Agregar producto a este reporte</p>
                                                    <input type="text" value={nuevoItemEnEdicion.producto} onChange={e => setNuevoItemEnEdicion({...nuevoItemEnEdicion, producto:e.target.value})} style={{...S.input, marginBottom:8}} placeholder="Descripción" />
                                                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:8}}>
                                                        <input type="number" value={nuevoItemEnEdicion.cantidad} onChange={e => setNuevoItemEnEdicion({...nuevoItemEnEdicion, cantidad:e.target.value})} style={S.input} placeholder="Cantidad" />
                                                        <input type="number" value={nuevoItemEnEdicion.precio} onChange={e => setNuevoItemEnEdicion({...nuevoItemEnEdicion, precio:e.target.value})} style={S.input} placeholder="Precio" />
                                                    </div>
                                                    <button onClick={() => agregarItemAlReporte(r.id)} style={{...S.btnPrimary, width:'100%'}}>+ Agregar producto</button>
                                                </div>
                                            </div>
                                        )}

                                        <div style={{borderTop:'1px solid #dfe2e7', background:'#f9fafb', padding:'10px 16px', textAlign:'center'}}>
                                            <span style={{fontSize:11, color:'#6b7280'}}>Total del reporte: </span>
                                            <span style={{fontSize:14, fontWeight:700, color:'#2f4a68'}}>S/ {r.total.toFixed(2)}</span>
                                        </div>
                                    </div>
                                );
                            }) : (
                                <div style={{...S.panel, textAlign:'center', color:'#6b7280', fontSize:13}}>No hay reportes todavía. Crea uno para comenzar.</div>
                            )}
                        </div>
                    </div>

                    <style>{`
                        @media (max-width: 639px) {
                            .vista-inicio { display: ${vistaMovil === 'inicio' ? 'block' : 'none'} !important; }
                            .vista-agregar { display: ${vistaMovil === 'agregar' ? 'block' : 'none'} !important; }
                            .vista-reportes { display: ${vistaMovil === 'reportes' ? 'block' : 'none'} !important; }
                            .tabla-desktop { display: none !important; }
                        }
                        @media (min-width: 640px) {
                            .tabs-movil { display: none !important; }
                            .vista-inicio, .vista-agregar, .vista-reportes { display: block !important; }
                            .filas-movil { display: none !important; }
                        }
                    `}</style>
                </div>
            );
        }

        ReactDOM.render(<GastosApp />, document.getElementById('root'));
    </script>
</body>
</html>
